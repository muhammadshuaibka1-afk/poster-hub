<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poster Hub | Official Poster Collection</title>
<style>
:root{--bg:#0d0b14;--card:#171322;--card2:#1f1a2e;--line:#2e2745;--tx:#ece8f7;--mu:#9a93b3;--pu:#8b5cf6;--pu2:#c084fc;--red:#f43f5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#2a1b4d,transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:#0d0b14ee;backdrop-filter:blur(10px);z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px}.logo b{background:linear-gradient(90deg,var(--pu),var(--pu2));-webkit-background-clip:text;background-clip:text;color:transparent}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:linear-gradient(135deg,var(--pu),#6d28d9);border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px #8b5cf655}
.btn.g{background:var(--card2);border:1px solid var(--line)}.btn.d{background:#3b1220;border:1px solid #6b1d34;color:#fda4af}
.btn.s{padding:6px 11px;font-size:13px}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--pu)}
main{padding:24px 5vw 60px;max-width:1400px;margin:auto}
.hero{padding:30px 0 10px}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,44px)}.hero p{color:var(--mu);margin:0}
.bar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.bar input{flex:1;min-width:200px}.bar select{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:up .45s both;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--pu);box-shadow:0 12px 30px #8b5cf626}
.card .im{aspect-ratio:3/4;background:#000 center/cover;cursor:zoom-in}
.card .bd{padding:12px}.card h3{margin:0 0 4px;font-size:16px}.tag{display:inline-block;font-size:12px;background:#8b5cf622;color:var(--pu2);padding:2px 9px;border-radius:99px}
.pr{font-weight:700;color:var(--pu2)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.desc{color:var(--mu);font-size:13px;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.stat{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:16px;animation:up .4s both}
.stat span{color:var(--mu);font-size:13px}.stat b{display:block;font-size:28px;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
.drop{border:2px dashed var(--pu);border-radius:14px;padding:26px;text-align:center;color:var(--mu);cursor:pointer;transition:.2s}
.drop:hover,.drop.on{background:#8b5cf61a}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto;animation:up .3s}
.lock{max-width:380px;margin:12vh auto;text-align:center}.lock .panel{padding:28px}
.q{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--mu)}.q img{width:44px;height:58px;object-fit:cover;border-radius:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--pu);padding:10px 18px;border-radius:12px;display:none;z-index:30}
.empty{text-align:center;color:var(--mu);padding:60px 0;grid-column:1/-1}
.hide{display:none!important}
.inst{background:linear-gradient(135deg,#14b8a6,#06b6d4);color:#fff;border:0;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.2s}.inst:hover{transform:translateY(-1px);box-shadow:0 6px 18px #06b6d455}.inst svg{width:15px;height:15px}
.ofc{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--pu);color:var(--pu2);padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:6px;font-weight:600}
</style></head><body>
<header>
 <div class="logo">🖼️ Poster <b>Hub</b> <span class="ofc">Official</span></div>
 <div style="display:flex;gap:8px;align-items:center"><button class="inst" id="inst" aria-label="Install app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg><b style="font-weight:600">Install</b></button>Gallery</button><button class="btn s" id="navAdmin">🔒 Admin</button></div>
</header>
<main>
 <section id="shop">
  <div class="hero"><h1>Poster Hub — Official Poster Collection</h1><p>Browse our curated posters and search by title.</p></div>
  <div class="bar"><input id="q" placeholder="Search posters…"></div>
  <div class="grid" id="g"></div>
 </section>
 <section id="admin" class="hide"></section>
</main>
<footer style="text-align:center;color:var(--mu);font-size:13px;padding:24px 5vw;border-top:1px solid var(--line)">© 2026 Poster Hub. All rights reserved.</footer>
<div class="modal" id="view"><img id="vimg" style="max-width:100%;max-height:90vh;border-radius:12px"></div>
<div class="modal" id="ed"><div class="box">
 <h3 style="margin-top:0">Edit poster</h3>
 <div class="f" style="grid-template-columns:1fr">
  <input id="eT" placeholder="Title">
 </div>
 <div class="row" style="margin-top:14px"><button class="btn g" id="eX">Cancel</button><button class="btn" id="eS">Save</button></div>
</div></div>
<div class="modal" id="inm"><div class="box"><h3 style="margin-top:0">Install Poster Hub</h3><p id="inmt" style="margin:0 0 10px"></p><p style="color:var(--mu);font-size:13px;margin:0">This adds a shortcut to the page. An internet connection is still needed to load posters.</p><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="inx">Got it</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
let db=null,assets=null,user=null,isAdmin=false,posters=[],editing=null,tab='shop',unlocked=false;
const PH='fad6abfeab717efab27650bf85042edfb272a2cca267b9a406f250f9683b89fd';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
const cats=()=>[...new Set(posters.map(p=>p.category).filter(Boolean))].sort();
const money=n=>n||n===0?'$'+Number(n).toFixed(2):'';

function card(p,adm){return `<div class="card"><div class="im" style="background-image:url('${esc(p.url)}')" data-v="${esc(p.url)}"></div><div class="bd"><h3>${esc(p.title)}</h3><div class="row"><span></span>${adm?`<span><button class="btn g s" data-e="${p.id}">Edit</button> <button class="btn d s" data-d="${p.id}">Delete</button></span>`:''}</div></div></div>`}

function renderShop(){
 const q=$('#q').value.toLowerCase();
 const list=posters.filter(p=>!q||(p.title||'').toLowerCase().includes(q));
 $('#g').innerHTML=list.length?list.map(p=>card(p,false)).join(''):'<div class="empty">No posters found.</div>';
}
function renderCats(){}
function renderAdmin(){
 const el=$('#admin');
 if(!isAdmin){el.innerHTML=`<div class="lock"><div class="panel"><div style="font-size:40px">🔒</div><h2>Admin access</h2><p style="color:var(--mu)">The dashboard is restricted to authorized admins. Only the owner and invited editors, signed in to claude.ai, can open it and change data.</p></div></div>`;return}
 if(!unlocked){el.innerHTML=`<div class="lock"><div class="panel"><div style="font-size:40px">🔑</div><h2>Admin login</h2><p style="color:var(--mu)">Enter the admin password to continue.</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="pwb" style="margin-top:12px;width:100%">Enter</button><p id="pwe" style="color:#fda4af;min-height:20px;margin:10px 0 0"></p></div></div>`;
  const go=async()=>{if(await sha('posterhub:'+$('#pw').value)===PH){unlocked=true;renderAdmin()}else{$('#pwe').textContent='Incorrect password';$('#pw').value=''}};
  $('#pwb').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};return}
 const total=posters.reduce((s,p)=>s+(+p.price||0),0);
 el.innerHTML=`<div class="hero"><h1>Dashboard</h1><p>Manage your poster collection.</p></div>
 <div class="stats"><div class="stat"><span>Total posters</span><b>${posters.length}</b></div></div>
 <div class="panel"><h3 style="margin-top:0">Upload posters</h3>
  <div class="drop" id="drop">📤 Click or drop images here (multiple allowed)</div>
  <input type="file" id="file" accept="image/*" multiple class="hide">
  <div class="f"><input id="nT" placeholder="Title (blank = file name)"></div>
  <div id="qs"></div><div class="row"><span id="st" style="color:var(--mu)"></span><button class="btn" id="up">Upload</button></div></div>
 <div class="panel"><div class="bar" style="margin:0 0 14px"><input id="aq" placeholder="Search your posters…"></div><div class="grid" id="ag"></div></div>`;
 let files=[];
 const drop=$('#drop'),fi=$('#file');
 const setF=fl=>{files=[...fl].filter(f=>f.type.startsWith('image/'));$('#qs').innerHTML=files.map(f=>`<div class="q"><img src="${URL.createObjectURL(f)}">${esc(f.name)}</div>`).join('')};
 drop.onclick=()=>fi.click();fi.onchange=()=>setF(fi.files);
 drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};drop.ondragleave=()=>drop.classList.remove('on');
 drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');setF(e.dataTransfer.files)};
 $('#up').onclick=async()=>{
  if(!files.length)return toast('Choose images first');
  const btn=$('#up');btn.disabled=true;let n=0;
  for(const f of files){
   try{$('#st').textContent=`Uploading ${n+1}/${files.length}…`;
    const a=await assets.upload(f);const id=db.collection('posters').doc().id;
    const t=$('#nT').value.trim();
    await db.collection('posters').doc(id).set({title:files.length>1||!t?(t?t+' '+(n+1):f.name.replace(/\.[^.]+$/,'')):t,url:a.url,assetId:a.id,created:Date.now()});n++;
   }catch(e){toast('Upload failed: '+(e.message||e.code||'error'))}
  }
  btn.disabled=false;toast(n+' poster(s) uploaded');files=[];renderAdmin();
 };
 $('#aq').oninput=drawAdminGrid;drawAdminGrid();
}
function drawAdminGrid(){
 const q=($('#aq')?.value||'').toLowerCase(),g=$('#ag');if(!g)return;
 const l=posters.filter(p=>!q||(p.title||'').toLowerCase().includes(q));
 g.innerHTML=l.length?l.map(p=>card(p,true)).join(''):'<div class="empty">No posters yet. Upload your first one above.</div>';
}
function show(t){tab=t;$('#shop').classList.toggle('hide',t!=='shop');$('#admin').classList.toggle('hide',t!=='admin');if(t==='admin')renderAdmin()}
function refresh(){renderCats();renderShop();if(tab==='admin'&&isAdmin){const keep=$('#aq')?.value;if(!document.activeElement||!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){renderAdmin();if(keep&&$('#aq')){$('#aq').value=keep;drawAdminGrid()}}else{drawAdminGrid()}}}

document.addEventListener('click',async e=>{
 const v=e.target.closest('[data-v]');if(v){$('#vimg').src=v.dataset.v;$('#view').classList.add('show')}
 const ed=e.target.closest('[data-e]');if(ed&&isAdmin){editing=posters.find(p=>p.id===ed.dataset.e);if(!editing)return;$('#eT').value=editing.title||'';$('#ed').classList.add('show')}
 const dl=e.target.closest('[data-d]');if(dl&&isAdmin){const p=posters.find(x=>x.id===dl.dataset.d);if(p){try{await db.collection('posters').doc(p.id).delete();if(p.assetId)try{await assets.delete(p.assetId)}catch(_){}toast('Deleted')}catch(err){toast('Delete failed')}}}
});
$('#view').onclick=()=>$('#view').classList.remove('show');
$('#eX').onclick=()=>$('#ed').classList.remove('show');
$('#eS').onclick=async()=>{if(!editing)return;try{await db.collection('posters').doc(editing.id).set({...editing,id:undefined,title:$('#eT').value.trim()||'Untitled'});$('#ed').classList.remove('show');toast('Saved')}catch(e){toast('Save failed')}};
$('#navShop').onclick=()=>show('shop');
let dip=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function instLabel(){$('#inst b').textContent=standalone()?'Open App':'Install'}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
addEventListener('appinstalled',()=>{dip=null;toast('App installed');instLabel()});
function installHelp(){
 const ua=navigator.userAgent,ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),and=/Android/.test(ua),edge=/Edg\//.test(ua),ff=/Firefox/.test(ua),saf=/^((?!chrome|android).)*safari/i.test(ua);
 let t;
 if(ios)t='On iPhone or iPad, open this page in Safari, tap the Share button, then choose “Add to Home Screen”.';
 else if(and)t='Tap the browser menu (⋮), then choose “Install app” or “Add to Home screen”.';
 else if(ff)t='Firefox on desktop can’t install web apps. Open this page in Chrome or Edge, or bookmark it.';
 else if(saf)t='In Safari on Mac, choose File → Add to Dock.';
 else t=edge?'In Edge, open the menu (…) → Apps → Install this site as an app.':'In Chrome, click the install icon in the address bar, or open the menu (⋮) → Cast, save and share → Install page as app.';
 $('#inmt').textContent=t;$('#inm').classList.add('show');
}
$('#inst').onclick=async()=>{
 if(standalone())return toast('You are already using the app');
 if(dip){const p=dip;dip=null;try{p.prompt();await p.userChoice}catch(e){}return}
 installHelp();
};
$('#inx').onclick=()=>$('#inm').classList.remove('show');
$('#inm').onclick=e=>{if(e.target.id==='inm')$('#inm').classList.remove('show')};
instLabel();$('#navAdmin').onclick=()=>show('admin');
$('#q').oninput=renderShop;

(async()=>{
 renderCats();renderShop();
 try{
  claude.use('user').then(u=>{user=u;isAdmin=!!(u&&u.canEdit());$('#navAdmin').textContent=isAdmin?'⚙️ Admin':'🔒 Admin';if(tab==='admin')renderAdmin()}).catch(()=>{});
  claude.use('assets').then(a=>assets=a).catch(()=>{});
  db=await claude.use('db');
  if(db){db.collection('posters').orderBy('created','desc').onSnapshot(s=>{posters=s.docs.map(d=>({...d.data(),id:d.id}));refresh()},()=>toast('Could not load posters'))}
  else $('#g').innerHTML='<div class="empty">Sign in to claude.ai to view posters.</div>';
 }catch(e){}
})();
</script></body></html>
